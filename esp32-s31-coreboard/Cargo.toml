[package]
name         = "esp32-s31-coreboard"
description  = "Board support for the ESP32-S31-Function-CoreBoard-1: pins, PSRAM, codec I2C bus, RGB LED, BOOT button"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
readme       = "../README.md"
keywords     = ["esp32", "esp32s31", "embedded", "no-std", "board-support"]
categories   = ["embedded", "no-std", "hardware-support"]

[lints]
workspace = true

[features]
default = []
# `board::init_logger()`: log through esp-println on UART0. Off by default so
# a firmware picks its own console and logger.
log = ["dep:esp-println"]

# The drivers, only for the ESP32-S31. Hardware-independent modules (none
# yet) go under plain `[dependencies]` and are unit-tested on a PC:
#   cargo test -p esp32-s31-coreboard --target <host triple>
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal     = { workspace = true }
esp-alloc   = { workspace = true }
esp-println = { workspace = true, optional = true }
embassy-time     = { workspace = true }
esp-hal-smartled = { workspace = true }
smart-leds       = { workspace = true }
